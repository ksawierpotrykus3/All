[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastz-bot"
version = "0.1.0"
description = "Last Z: Survival Shooter automation bot"
requires-python = ">=3.11"
dependencies = [
    "dxcam>=0.3.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "dearpygui>=2.3",
    "Pillow>=10.0",
    "rapidocr-onnxruntime>=1.2.3",
    "winocr>=0.0.15",
    "httpx>=0.28",
    "fastapi>=0.135",
    "uvicorn>=0.34",
    "bcrypt>=5.0",
    "PyJWT>=2.13",
    "pydantic-settings>=2.14",
    "email-validator>=2.0",
    "alembic>=1.18",
    "stripe>=13.0",
    "redis>=6.0",
    "cryptography>=43.0",
    "psutil>=6.0",
    "jinja2>=3.1",
    "plotly>=5.0",
    "tabulate>=0.10.0",
]
license = {text = "Proprietary"}

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15",
    "bandit>=1.9",
    "vulture>=2.16",
    "scalene>=1.5.24,<2",  # 2.x: brak wheel dla CPython 3.11 na Windows
    "hypothesis>=6.167.1",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["mvp/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bot: bot engine tests (require game running)",
    "vision: computer vision tests (require screenshots)",
    "gui: GUI tests",
    "backend: backend API tests",
    "integration: integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
    "venv/",
]

[tool.setuptools]
package-dir = {"" = "."}

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.15.0",
]

